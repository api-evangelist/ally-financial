"""
A webhook subscription for receiving event notifications.
"""
type Webhook {
  id: ID!
  url: String!
  events: [WebhookEvent!]!
  status: AccountStatus!
  signingSecret: String!
  createdAt: DateTime!
  lastTriggeredAt: DateTime
  deliverySuccessRate: Decimal
}

# ─── Documents ────────────────────────────────────────────────────────────────

"""
A monthly or annual account statement.
"""
type Statement {
  id: ID!
  accountId: String!
  statementDate: Date!
  periodStart: Date!
  periodEnd: Date!
  documentType: DocumentType!
  downloadUrl: String!
  generatedAt: DateTime!
}

"""
A tax document (1099-INT, 1099-DIV, 1098, etc.) for an account.
"""
type TaxDocument {
  id: ID!
  accountId: String!
  taxYear: Int!
  documentType: DocumentType!
  downloadUrl: String!
  generatedAt: DateTime!
}

# ─── Pagination ───────────────────────────────────────────────────────────────

"""
Pagination cursor information for list results.
"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalCount: Int!
}

# ─── Root Types ───────────────────────────────────────────────────────────────

type Query {
  # Deposit accounts
  checkingAccount(id: ID!): CheckingAccount
  savingsAccount(id: ID!): SavingsAccount
  moneyMarketAccount(id: ID!): MoneyMarketAccount
  certificateOfDeposit(id: ID!): CertificateOfDeposit
  iraAccount(id: ID!): IRAAccount

  # Investment accounts
  investmentAccount(id: ID!): InvestmentAccount
  brokerageAccount(id: ID!): BrokerageAccount

  # Lending
  autoLoan(id: ID!): AutoLoan
  personalLoan(id: ID!): PersonalLoan
  mortgage(id: ID!): Mortgage
  homeEquityLoan(id: ID!): HomeEquityLoan
  homeEquityLineOfCredit(id: ID!): HomeEquityLineOfCredit

  # Transfers and payments
  payment(id: ID!): Payment
  transfer(id: ID!): Transfer
  achTransfer(id: ID!): ACHTransfer
  wireTransfer(id: ID!): WireTransfer
  zelleTransfer(id: ID!): ZelleTransfer

  # Cards and locations
  debitCard(id: ID!): DebitCard
  creditCard(id: ID!): CreditCard
  atmLocations(latitude: Decimal!, longitude: Decimal!, radiusMiles: Int): [ATMLocation!]!
  branches(latitude: Decimal!, longitude: Decimal!, radiusMiles: Int): [Branch!]!

  # Rates
  currentRates: [Rate!]!
  historicalRates(rateType: RateType!, startDate: Date!, endDate: Date!): [HistoricalRate!]!

  # Quotes
  autoFinanceQuote(id: ID!): AutoFinanceQuote

  # Auto finance (dealer)
  carDealership(dealerCode: String!): CarDealership
  floorPlanCredit(dealerCode: String!): FloorPlanCredit
  remarketing(dealerCode: String!): Remarketing
  customerPortfolio(dealerCode: String!): CustomerPortfolio

  # Customers
  bankCustomer(id: ID!): BankCustomer
  businessCustomer(id: ID!): BusinessCustomer

  # API platform
  apiKeys: [APIKey!]!
  webhooks: [Webhook!]!
  oauthClients: [OAuthClient!]!

  # Documents
  statements(accountId: ID!): [Statement!]!
  taxDocuments(accountId: ID!, taxYear: Int): [TaxDocument!]!
}

type Mutation {
  # Transfers and payments
  createTransfer(fromAccountId: ID!, toAccountId: ID!, amount: Decimal!, scheduledDate: Date, memo: String): Transfer!
  createACHTransfer(fromAccountId: ID!, toExternalAccountId: ID!, amount: Decimal!, direction: String!, memo: String): ACHTransfer!
  createWireTransfer(fromAccountId: ID!, beneficiaryName: String!, beneficiaryRoutingNumber: String!, beneficiaryAccountNumber: String!, amount: Decimal!, memo: String): WireTransfer!
  createZelleTransfer(fromAccountId: ID!, recipientToken: String!, amount: Decimal!, memo: String): ZelleTransfer!
  schedulePayment(fromAccountId: ID!, payeeId: ID!, amount: Decimal!, scheduledDate: Date!, memo: String): Payment!
  cancelPayment(paymentId: ID!): Payment!

  # Overdraft protection
  enrollOverdraftProtection(checkingAccountId: ID!, linkedAccountId: ID!): OverdraftProtection!
  unenrollOverdraftProtection(id: ID!): OverdraftProtection!

  # Cards
  lockCard(cardId: ID!): DebitCard!
  unlockCard(cardId: ID!): DebitCard!
  reportCardLost(cardId: ID!): DebitCard!
  requestReplacementCard(cardId: ID!): DebitCard!

  # Auto payment
  enrollAutoPayment(loanId: ID!, fundingAccountId: ID!, paymentAmount: Decimal!, paymentDay: Int!): AutoPayment!
  cancelAutoPayment(id: ID!): AutoPayment!

  # API platform
  createAPIKey(name: String!, scopes: [String!]!): APIKey!
  revokeAPIKey(id: ID!): APIKey!
  createWebhook(url: String!, events: [WebhookEvent!]!): Webhook!
  updateWebhook(id: ID!, url: String, events: [WebhookEvent!], status: AccountStatus): Webhook!
  deleteWebhook(id: ID!): Webhook!

  # Profile
  updateProfile(email: String, phoneNumber: String, paperlessEnabled: Boolean, marketingOptIn: Boolean): Profile!
  updateAddress(id: ID!, line1: String, line2: String, city: String, state: String, postalCode: String): Address!
}

type Subscription {
  transactionPosted(accountId: ID!): Transaction!
  paymentStatusChanged(paymentId: ID!): Payment!
  transferStatusChanged(transferId: ID!): Transfer!
  balanceUpdated(accountId: ID!): AccountBalance!
  documentAvailable(accountId: ID!): Statement!
}
