"""
Ally Financial GraphQL Schema
Conceptual schema modeling banking, investing, auto finance, and identity domains.
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar Date
scalar DateTime
scalar Decimal
scalar JSON

# ─── Enums ──────────────────────────────────────────────────────────────────

enum AccountStatus {
  ACTIVE
  INACTIVE
  CLOSED
  PENDING
  FROZEN
}

enum TransactionType {
  DEBIT
  CREDIT
  TRANSFER
  PAYMENT
  FEE
  INTEREST
  DIVIDEND
  DEPOSIT
  WITHDRAWAL
}

enum TransactionStatus {
  PENDING
  POSTED
  CANCELLED
  RETURNED
}

enum PaymentStatus {
  SCHEDULED
  PROCESSING
  COMPLETED
  FAILED
  CANCELLED
}

enum LoanStatus {
  CURRENT
  DELINQUENT
  PAID_OFF
  CHARGED_OFF
  IN_DEFAULT
}

enum CardStatus {
  ACTIVE
  BLOCKED
  CANCELLED
  EXPIRED
}

enum WebhookEvent {
  TRANSACTION_POSTED
  PAYMENT_COMPLETED
  PAYMENT_FAILED
  TRANSFER_COMPLETED
  BALANCE_UPDATED
  STATEMENT_AVAILABLE
  DOCUMENT_AVAILABLE
}

enum DocumentType {
  MONTHLY_STATEMENT
  ANNUAL_STATEMENT
  TAX_1099_INT
  TAX_1099_DIV
  TAX_1099_B
  TAX_1098
  CONFIRMATION
}

enum AddressType {
  PRIMARY
  MAILING
  WORK
  PREVIOUS
}

enum ContactType {
  EMAIL
  PHONE_HOME
  PHONE_MOBILE
  PHONE_WORK
  FAX
}

enum RateType {
  SAVINGS
  CD
  MONEY_MARKET
  IRA
  AUTO_LOAN
  MORTGAGE_30_YEAR
  MORTGAGE_15_YEAR
  HOME_EQUITY
  PERSONAL_LOAN
}

enum DealerProgramType {
  FLOOR_PLAN
  REMARKETING
  DEALER_DIRECT
  MANUFACTURER_INCENTIVE
}

# ─── Banking: Deposit Accounts ───────────────────────────────────────────────

"""
Base type for all Ally Financial bank accounts.
"""
type BankAccount {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  status: AccountStatus!
  openedDate: Date!
  closedDate: Date
  nickname: String
  balance: AccountBalance!
  availableBalance: AvailableBalance!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

"""
Ally Interest Checking or basic checking account.
"""
type CheckingAccount {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  status: AccountStatus!
  openedDate: Date!
  closedDate: Date
  nickname: String
  balance: AccountBalance!
  availableBalance: AvailableBalance!
  apy: APY!
  overdraftProtection: OverdraftProtection
  debitCard: DebitCard
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  directDeposit: DirectDeposit
  statements: [Statement!]!
  customer: BankCustomer!
}

"""
Ally Online Savings Account with high-yield APY.
"""
type SavingsAccount {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  status: AccountStatus!
  openedDate: Date!
  closedDate: Date
  nickname: String
  balance: AccountBalance!
  availableBalance: AvailableBalance!
  apy: APY!
  interestEarnedYTD: Decimal!
  interestRate: Rate!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

"""
Ally Money Market Account offering check-writing and higher yields.
"""
type MoneyMarketAccount {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  status: AccountStatus!
  openedDate: Date!
  closedDate: Date
  nickname: String
  balance: AccountBalance!
  availableBalance: AvailableBalance!
  apy: APY!
  minimumBalance: Decimal!
  interestRate: Rate!
  checkWritingEnabled: Boolean!
  debitCard: DebitCard
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

"""
Ally Certificate of Deposit (CD) with fixed terms and rates.
"""
type CertificateOfDeposit {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  status: AccountStatus!
  openedDate: Date!
  maturityDate: Date!
  termMonths: Int!
  principal: Decimal!
  apy: APY!
  interestRate: Rate!
  interestEarned: Decimal!
  penaltyForEarlyWithdrawal: Decimal!
  autoRenew: Boolean!
  renewalNoticeSentDate: Date
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

"""
Ally IRA (Traditional, Roth, or SEP) account.
"""
type IRAAccount {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  iraType: String!
  status: AccountStatus!
  openedDate: Date!
  balance: AccountBalance!
  apy: APY!
  contributionYTD: Decimal!
  contributionLimit: Decimal!
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

# ─── Investment Accounts ─────────────────────────────────────────────────────

"""
Ally Invest self-directed or managed investment account.
"""
type InvestmentAccount {
  id: ID!
  accountNumber: String!
  accountType: String!
  status: AccountStatus!
  openedDate: Date!
  totalValue: Decimal!
  cashBalance: Decimal!
  dayChangeAmount: Decimal!
  dayChangePercent: Decimal!
  holdings: [Holding!]!
  positions: [Position!]!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

"""
Ally Invest brokerage account for self-directed trading.
"""
type BrokerageAccount {
  id: ID!
  accountNumber: String!
  status: AccountStatus!
  openedDate: Date!
  marginEnabled: Boolean!
  optionsLevel: Int!
  totalValue: Decimal!
  cashBalance: Decimal!
  marginBalance: Decimal
  buyingPower: Decimal!
  holdings: [Holding!]!
  positions: [Position!]!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  taxDocuments: [TaxDocument!]!
  customer: BankCustomer!
}

"""
A security or fund held in an investment or brokerage account.
"""
type Holding {
  id: ID!
  symbol: String!
  description: String!
  quantity: Decimal!
  costBasis: Decimal!
  currentPrice: Decimal!
  currentValue: Decimal!
  unrealizedGainLoss: Decimal!
  unrealizedGainLossPercent: Decimal!
