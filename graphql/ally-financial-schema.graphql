# ─── Balances ────────────────────────────────────────────────────────────────

"""
Current ledger balance of an account.
"""
type AccountBalance {
  amount: Decimal!
  currency: String!
  asOf: DateTime!
}

"""
Available (spendable) balance after pending transactions.
"""
type AvailableBalance {
  amount: Decimal!
  currency: String!
  pendingAmount: Decimal!
  asOf: DateTime!
}

"""
Ledger balance representing posted transactions only.
"""
type LedgerBalance {
  amount: Decimal!
  currency: String!
  asOf: DateTime!
}

# ─── Transactions ─────────────────────────────────────────────────────────────

"""
Paginated list of transactions for an account.
"""
type TransactionHistory {
  transactions: [Transaction!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""
A single financial transaction on an account.
"""
type Transaction {
  id: ID!
  type: TransactionType!
  status: TransactionStatus!
  amount: Decimal!
  currency: String!
  description: String!
  memo: String
  postedDate: Date
  transactionDate: Date!
  runningBalance: Decimal
  merchant: Merchant
  category: String
  checkNumber: String
  referenceNumber: String
}

"""
Merchant details associated with a card transaction.
"""
type Merchant {
  name: String!
  category: String
  categoryCode: String
  city: String
  state: String
  country: String
  postalCode: String
}

# ─── Payments and Transfers ──────────────────────────────────────────────────

"""
A scheduled or completed bill payment.
"""
type Payment {
  id: ID!
  status: PaymentStatus!
  amount: Decimal!
  currency: String!
  scheduledDate: Date!
  processedDate: Date
  memo: String
  payeeId: String!
  payeeName: String!
  fromAccountId: String!
  confirmationNumber: String
}

"""
An internal or external account transfer.
"""
type Transfer {
  id: ID!
  status: PaymentStatus!
  amount: Decimal!
  currency: String!
  scheduledDate: Date!
  processedDate: Date
  memo: String
  fromAccountId: String!
  toAccountId: String!
  confirmationNumber: String
  recurring: Boolean!
  frequency: String
}

"""
An ACH (Automated Clearing House) transfer.
"""
type ACHTransfer {
  id: ID!
  status: PaymentStatus!
  amount: Decimal!
  currency: String!
  direction: String!
  scheduledDate: Date!
  processedDate: Date
  settlementDate: Date
  traceNumber: String
  fromAccountId: String!
  toExternalAccountId: String!
  memo: String
}

"""
A domestic or international wire transfer.
"""
type WireTransfer {
  id: ID!
  status: PaymentStatus!
  amount: Decimal!
  currency: String!
  initiatedDate: DateTime!
  processedDate: DateTime
  fromAccountId: String!
  beneficiaryName: String!
  beneficiaryRoutingNumber: String!
  beneficiaryAccountNumber: String!
  beneficiaryBankName: String
  memo: String
  feeAmount: Decimal!
  confirmationNumber: String
}

"""
A Zelle peer-to-peer payment.
"""
type ZelleTransfer {
  id: ID!
  status: PaymentStatus!
  amount: Decimal!
  currency: String!
  direction: String!
  initiatedDate: DateTime!
  processedDate: DateTime
  recipientToken: String!
  recipientName: String!
  memo: String
  confirmationNumber: String
}

"""
Direct deposit configuration for a checking account.
"""
type DirectDeposit {
  accountId: ID!
  routingNumber: String!
  accountNumber: String!
  accountType: String!
  lastDepositDate: Date
  lastDepositAmount: Decimal
  preNoteStatus: String
}

# ─── Overdraft Protection ─────────────────────────────────────────────────────

"""
Overdraft protection settings linked to a checking account.
"""
type OverdraftProtection {
  id: ID!
  enabled: Boolean!
  linkedAccountId: String!
  transferFee: Decimal!
  minimumTransferAmount: Decimal!
  maximumTransferAmount: Decimal!
}

"""
An automatic transfer triggered by overdraft protection.
"""
type OverdraftTransfer {
  id: ID!
  amount: Decimal!
  transferDate: DateTime!
  fromAccountId: String!
  toAccountId: String!
  feeCharged: Decimal!
  status: PaymentStatus!
}

