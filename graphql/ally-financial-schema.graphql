}

"""
An open position in a brokerage account.
"""
type Position {
  id: ID!
  symbol: String!
  description: String!
  quantity: Decimal!
  averageCost: Decimal!
  marketValue: Decimal!
  openDate: Date!
  longShort: String!
}

