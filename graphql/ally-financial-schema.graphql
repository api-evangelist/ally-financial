}

# ─── Rates ───────────────────────────────────────────────────────────────────

"""
Current interest rate for a product type.
"""
type Rate {
  id: ID!
  rateType: RateType!
  rate: Decimal!
  asOf: DateTime!
  termMonths: Int
  minimumBalance: Decimal
  productName: String!
}

"""
Historical rate data point for a product.
"""
type HistoricalRate {
  rateType: RateType!
  rate: Decimal!
  effectiveDate: Date!
  productName: String!
}

"""
Annual Percentage Yield for a deposit product.
"""
type APY {
  value: Decimal!
  asOf: DateTime!
  termMonths: Int
  minimumBalance: Decimal
}

"""
Annual Percentage Rate for a lending product.
"""
type APR {
  value: Decimal!
  asOf: DateTime!
  isFixed: Boolean!
  rateFloor: Decimal
  rateCeiling: Decimal
