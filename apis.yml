  properties:
  - type: GraphQL
    url: graphql/ally-financial-graphql.md
- name: Ally Invest API (Legacy / Retired)
  description: >-
    The legacy Ally Invest brokerage REST API, inherited from Ally's 2016
    acquisition of TradeKing. It offered OAuth 1.0a authenticated access
    (consumer key/secret plus OAuth token/secret) over documented resource
    groups - Accounts (balances, history, holdings), Orders/Trading (preview
    and submit via FIXML), Market data (quotes, clock, timesales, toplists,
    options chains, news), Member profile, Watchlists, and Utility status -
    returning JSON or XML. Ally Invest has since pivoted to managed and robo
    portfolios; the developer registration and documentation pages now resolve
    to marketing content, so this API is treated as retired and is listed
    humanURL-only. No downloadable OpenAPI/Swagger is published by Ally.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ally.com/api/invest/documentation/getting-started/
  baseURL: https://devapi.invest.ally.com/v1
