name: Ally Financial
kind: company
type: Index
description: >-
  Ally Financial (NYSE: ALLY) is a US super-regional, all-digital bank holding
  company and one of the country's largest auto finance providers, offering
  online deposit accounts, auto and personal lending, mortgages, credit cards,
  and self-directed and robo brokerage through Ally Invest. Ally does not
  operate a live, self-serve first-party public developer portal for its
  consumer banking products. Programmatic access to Ally Bank account and
  transaction data is delivered through third-party open-finance aggregators
  (Plaid and Flinks are documented), and the legacy Ally Invest brokerage REST
  API (inherited from the 2016 TradeKing acquisition) has effectively been
  retired as Ally Invest shifted toward managed and robo portfolios.
