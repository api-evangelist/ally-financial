apis:
- name: Ally Financial Platform (Conceptual Model)
  description: >-
    A conceptual, API-Evangelist-derived domain model of Ally Financial's
    consumer platform spanning deposit accounts (checking, savings, money
    market, CDs, IRAs), lending (auto, personal, mortgage, home equity),
    self-directed and managed investing, and dealer/auto-finance services.
    This is NOT a live, published public API - Ally exposes no self-serve
    first-party developer portal for these products. The model is provided
    for API design discussion, gateway/GraphQL modeling, and catalog
    discoverability only; consumer data access in production is via
    open-finance aggregators.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ally.com/
  tags:
  - Banking
  - Auto Finance
  - Investing
